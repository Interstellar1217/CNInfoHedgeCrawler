# AstrBot Plugin Metadata
# 文档：https://astrbot.app/dev/plugin.html

name: cninfo_hedge
display_name: 巨潮资讯套期保值公告查询
desc: 在 QQ/微信/Telegram 中查询 A 股上市公司套期保值公告，支持关键词搜索和日期范围过滤。
author: Interstellar1217
version: "1.1.0"
repo: https://github.com/Interstellar1217/CNInfoHedgeCrawler
social_link: https://github.com/Interstellar1217
category: 实用工具

# 搜索关键词
tags:
  - 套期保值
  - 公告查询
  - 巨潮资讯
  - 金融

# 插件类型
type: standard

# Python 版本要求
python_version: ">=3.10"

# 配置项
config:
  keyword_default:
    value: "套期保值"
    description: "默认搜索关键词"
    type: string
  max_pages_default:
    value: 1
    description: "默认最大爬取页数"
    type: number

# 命令列表
commands:
  - name: 套保查询
    description: "搜索公告，用法：/套保查询 [关键词] [开始日期] [结束日期]"
  - name: 套保
    description: "快捷查询，用法：/套保 [开始日期] [结束日期]"
